<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOSAIC · Supervisor</title><link rel="stylesheet" href="{{ url_for('static',filename='control_room.css') }}"></head>
<body><header><div class="identity"><strong>MOSAIC</strong><span>Supervisor</span></div><div class="controls"><select id="test-scenario" aria-label="Synthetic test scenario"><option value="">Test scenarios</option></select><select id="traffic-plan" aria-label="Traffic plan"><option value="TEAM_MIXED">GA</option><option value="FCFS">FCFS</option><option value="RECONSTRUCTED">Reference</option></select><button id="load-test">Load</button><button id="play">Play</button><select id="speed" aria-label="Simulation speed"><option value="1">1×</option><option value="5">5×</option><option value="10">10×</option><option value="30" selected>30×</option><option value="60">60×</option></select><button id="restart">Restart</button><button id="all-views">All views</button><button id="theme-toggle">Night</button></div><div class="clock"><span id="run-status">Paused</span><strong id="clock">00:00:00</strong><span>UTC</span></div></header>
<div class="timebar"><output id="traffic-count" aria-live="polite"></output><input id="timeline" type="range" min="0" max="1" value="0" step="5" aria-label="Scenario time" disabled><output id="message" role="status"></output></div><div id="sector-capacity" style="padding:0 16px 6px;font-size:11px" aria-live="polite"></div>
<main id="views"><section data-view="centre"><h2>Centre <span><button data-focus="centre" aria-label="Expand Centre">⛶</button><a href="/centre" target="_blank" rel="noopener">Open ↗</a></span></h2><iframe src="/centre?supervised=1" title="Ho Chi Minh Centre"></iframe></section><section data-view="approach"><h2>Approach <span><button data-focus="approach" aria-label="Expand Approach">⛶</button><a href="/" target="_blank" rel="noopener">Open ↗</a></span></h2><iframe src="/?supervised=1" title="VVTS Approach"></iframe></section><section data-view="tower"><h2>Tower <span><button data-focus="tower" aria-label="Expand Tower">⛶</button><a href="/airport" target="_blank" rel="noopener">Open ↗</a></span></h2><iframe src="/airport?supervised=1" title="VVTS Tower"></iframe></section></main>
<script src="{{ url_for('static',filename='monitor_theme.js') }}"></script><script src="{{ url_for('static',filename='control_room.js') }}"></script></body></html>
